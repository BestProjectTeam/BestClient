name: Release Assets

# Flow:
#   1. git tag build-1.5 && git push origin build-1.5
#   2. Actions builds and creates a DRAFT release (github-actions[bot])
#   3. Draft is invisible to the in-game updater (/releases API skips drafts)
#   4. Edit the draft: change tag to v2.2, set title/notes, then Publish
#
# Build tags use build-* so retargeting the draft to a final v* tag does NOT
# start a second workflow. No gate job / concurrency (those queued behind stuck
# GitHub hosted-runner failures).
on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish assets for (for example, build-1.5 or v1.0.0)"
        required: true
      release_name:
        description: "Release name used when creating or updating a release manually"
        required: true
      body:
        description: "Optional release notes for manual publishing"
        required: false

permissions:
  contents: write

env:
  CLIENT_NAME: BestClient

jobs:
  build-cmake:
    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      # Exposed at job level so steps can read the cert without re-resolving secrets.
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-24.04
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DDISCORD_DYNAMIC=ON -DVULKAN=ON
          cmake-init-env: CXXFLAGS="-Werror -Wno-unused-function"
          package-file: "*-linux_x86_64.tar.xz"
          artifact-name: release-linux
          asset-name: BestClient-linux.tar.xz
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DVULKAN=ON
          cmake-init-env: CXXFLAGS= LDFLAGS=
          package-file: "*-win64.zip"
          artifact-name: release-windows
          asset-name: BestClient-windows.zip

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config ninja-build libcurl4-openssl-dev libfreetype6-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libsdl2-dev libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libpng-dev libvulkan-dev libglew-dev -y

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Build release binaries
      run: |
        cmake -S . -B build-release ${{ matrix.cmake-args }}
        cmake --build build-release --config Release --target game-client
        cmake --build build-release --config Release --target bestclient-updater

    # Unsigned Windows binaries that replace executables get flagged by Defender
    # (Bearfoos / Wacatac / DefenseEvasion). Signing is mandatory for release builds —
    # do not ship unsigned packages.
    - name: Require Windows code signing certificate
      if: contains(matrix.os, 'windows')
      shell: pwsh
      run: |
        if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
          throw "WINDOWS_CERT_BASE64 secret is required for Windows release builds. Refusing to package unsigned binaries."
        }
        if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
          throw "WINDOWS_CERT_PASSWORD secret is required for Windows release builds."
        }
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    - name: Sign Windows binaries
      if: contains(matrix.os, 'windows')
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        $CertPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if(-not $SignTool) { throw "signtool.exe not found" }
        # Multi-config MSVC builds put binaries under a per-config subdirectory, so locate
        # them instead of hardcoding the layout.
        $Targets = @("DDNet.exe", "bestclient-updater.exe") | ForEach-Object {
          Get-ChildItem -Path build-release -Filter $_ -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
        } | Where-Object { $_ }
        if($Targets.Count -ne 2) { throw "expected 2 binaries to sign, found $($Targets.Count)" }
        foreach($Target in $Targets) {
          & $SignTool sign /f $CertPath /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $Target
          if($LASTEXITCODE -ne 0) { throw "signing failed for $Target" }
        }
        Remove-Item $CertPath -Force

    - name: Package release build
      run: |
        cmake --build build-release --config Release --target package_default
        mkdir artifacts
        mv build-release/${{ matrix.package-file }} artifacts/${{ matrix.asset-name }}

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: artifacts/${{ matrix.asset-name }}

  build-android:
    name: Build Release (android)
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install ninja-build openjdk-21-jdk openssl
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.92.0
        cargo install cargo-ndk
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android
        scripts/android/download_android_sdk.sh /home/runner

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Prepare Android signing key
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      run: |
        TW_KEY_NAME=/home/runner/DDNet.jks
        # Tag pushes and manual dispatch use the persistent release keystore.
        if [ -n "$RELEASE_KEYSTORE_BASE64" ] && { [[ "$GITHUB_REF" == refs/tags/* ]] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TW_KEY_NAME"
          TW_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          TW_KEY_PW="$RELEASE_KEYSTORE_PASSWORD"
          echo "Signed with persistent release keystore" >> "$GITHUB_STEP_SUMMARY"
        else
          TW_KEY_ALIAS=DDNet-Key
          TW_KEY_PW="$(openssl rand -base64 32)"
          keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=DDNet CI, OU=DDNet, O=DDNet"
          echo "Signed with ephemeral CI keystore" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo "TW_KEY_NAME=$TW_KEY_NAME"
          echo "TW_KEY_ALIAS=$TW_KEY_ALIAS"
          echo "TW_KEY_PW=$TW_KEY_PW"
          echo "TW_VERSION_CODE=$(date -u +%Y%m%d%H)"
        } >> "$GITHUB_ENV"

    - name: Build Android app
      run: |
        export ANDROID_HOME="/home/runner/Android/Sdk"
        unset ANDROID_SDK_ROOT
        export PATH=/home/runner/cmake/bin:$PATH
        scripts/android/cmake_android.sh all DDNet org.ddnet.client Release build-android
        mkdir artifacts
        mv build-android/DDNet.apk artifacts/${{ env.CLIENT_NAME }}-android.apk

    - name: Upload Android package
      uses: actions/upload-artifact@v4
      with:
        name: release-android
        path: artifacts/${{ env.CLIENT_NAME }}-android.apk

  publish:
    name: Publish Release Assets
    needs:
      - build-cmake
      - build-android
    runs-on: ubuntu-latest
    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: List downloaded release packages
      run: ls -R artifacts

    # Draft so the in-game updater ignores it until you Publish in the GitHub UI.
    # Creating via GITHUB_TOKEN attributes the release to github-actions[bot].
    - name: Create draft GitHub release from tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          artifacts/${{ env.CLIENT_NAME }}-linux.tar.xz
          artifacts/${{ env.CLIENT_NAME }}-windows.zip
          artifacts/${{ env.CLIENT_NAME }}-android.apk

    - name: Create or update release manually
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: ${{ github.event.inputs.release_name }}
        body: ${{ github.event.inputs.body }}
        draft: true
        files: |
          artifacts/${{ env.CLIENT_NAME }}-linux.tar.xz
          artifacts/${{ env.CLIENT_NAME }}-windows.zip
          artifacts/${{ env.CLIENT_NAME }}-android.apk
